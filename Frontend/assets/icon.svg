<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A148C" />
      <stop offset="50%" stop-color="#311B92" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>

    <!-- Metallic Lock Gradient -->
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CFD8DC" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bgGrad)" />

  <!-- Shield Motif Overlay -->
  <path d="M 512 216 L 736 296 V 512 C 736 656 640 784 512 824 C 384 784 288 656 288 512 V 296 Z" 
        fill="#FFFFFF" 
        fill-opacity="0.08" />

  <!-- Padlock Shackle -->
  <path d="M 384 460 V 380 C 384 309 441 252 512 252 C 583 252 640 309 640 380 V 460" 
        fill="none" 
        stroke="url(#lockGrad)" 
        stroke-width="52" 
        stroke-linecap="round" 
        filter="url(#shadow)" />

  <!-- Padlock Main Body -->
  <rect x="336" y="440" width="352" height="288" rx="48" fill="url(#lockGrad)" filter="url(#shadow)" />

  <!-- Keyhole Base -->
  <circle cx="512" cy="552" r="32" fill="#1A237E" />

  <!-- Keyhole Slot -->
  <polygon points="492,560 532,560 524,632 500,632" fill="#1A237E" />
</svg>
